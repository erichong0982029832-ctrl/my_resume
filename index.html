<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人簡歷</title>
    <!-- 引入 GitHub 風格的 Markdown 樣式 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <!-- 引入 marked.js 負責將 Markdown 解析為 HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        @media (max-width: 767px) {
            body { padding: 15px; }
        }
    </style>
</head>
<body class="markdown-body">
    <!-- 畫面容器 -->
    <div id="content">資料載入中...</div>

    <!-- 邏輯腳本 -->
    <script>
        // 關注點分離：動態抓取同層級的 resume.md，並將其渲染至畫面
        fetch('./resume.md')
            .then(response => {
                if (!response.ok) throw new Error('伺服器找不到 resume.md');
                return response.text();
            })
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `網頁加載錯誤: ${err.message}`;
            });
    </script>
</body>
</html>
